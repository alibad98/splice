<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  /><title>Slips preview demonstration</title
  ><style>
    body {
      margin: 0;
      background: #faf8f6;
      color: #15110f;
      font: 14px/1.55 system-ui;
      display: grid;
      justify-items: center;
      padding: 16px;
      gap: 12px;
    }
    p {
      margin: 0;
      color: #615954;
      max-width: 45ch;
      text-align: center;
    }
    iframe {
      border: 0;
      width: min(360px, calc(100vw - 32px), calc((100dvh - 104px) * 9 / 16));
      aspect-ratio: 9/16;
      border-radius: 16px;
      box-shadow: 0 8px 24px -14px #28181040;
    }
  </style>
  <p>Demonstration · synthetic product and local geometric image fixture</p>
  <script type="module">
    const id = '11111111-1111-4111-8111-111111111111';
    window.demoManifest = () => ({
      v: 1,
      store_id: id,
      placements: [{ type: 'home', layout: 'ring', item_ids: [id] }],
      items: [
        {
          id,
          title: 'Everyday essentials, thoughtfully chosen',
          format: 'story',
          cta_label: 'Add to cart',
          cta_action: 'add_to_cart',
          cta_url: null,
          cta_style: null,
          product: {
            id,
            name: 'Amber studio object',
            image_url: '/demo.png',
            price_minor: 15900,
            sale_price_minor: 12900,
            currency: 'SAR',
            availability: 'available',
            has_required_options: false,
            deleted: false,
          },
          slides: [
            {
              id,
              media_asset_id: id,
              kind: 'image',
              alt_text: 'Local geometric studio object demonstration',
              status: 'processed',
              source_url: null,
              poster_url: null,
              renditions: [
                {
                  profile: 'web',
                  url: '/demo.png',
                  content_type: 'image/png',
                  width: 720,
                  height: 960,
                },
              ],
            },
            {
              id,
              media_asset_id: id,
              kind: 'video',
              alt_text: 'Local video demonstration',
              status: 'processed',
              source_url: null,
              poster_url: '/demo.png',
              renditions: [
                {
                  profile: '720p',
                  url: '/demo.webm',
                  content_type: 'video/webm',
                  width: 720,
                  height: 960,
                },
              ],
            },
          ],
        },
      ],
    });
    const frame = document.createElement('iframe');
    frame.title = 'Storefront player preview';
    window.sendPreview = (manifest, locale = 'en') =>
      frame.contentWindow.postMessage(
        { type: 'slips.preview.update', v: 1, manifest, locale },
        location.origin,
      );
    window.addEventListener('message', (event) => {
      if (
        event.origin === location.origin &&
        event.source === frame.contentWindow &&
        event.data?.type === 'slips.preview.ready' &&
        event.data.v === 1
      ) {
        window.previewReady = true;
        window.sendPreview(window.demoManifest());
      }
    });
    frame.src = '/preview-frame.html';
    document.body.append(frame);
  </script>
</html>
