name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Database-backed tests use postgres://slips:slips@127.0.0.1:5433/slips (same URL as the local test DB).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: slips
          POSTGRES_PASSWORD: slips
          POSTGRES_DB: slips
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U slips"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build

  player-cls:
    name: Player layout-shift (CLS) suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build runs the gzip budget gate (50 KB initial fails, 20 KB loader warns, viewer 25 KB, batcher 5 KB)
      - run: pnpm --filter @slips/player build
      - run: pnpm --filter @slips/player exec playwright install --with-deps chromium
      - run: pnpm --filter @slips/player test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-cls-results
          path: packages/player/test-results

  images:
    name: Docker build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: slips-${{ matrix.app }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
